name: Release container image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need all tags to decide whether this is the newest stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag and check it matches Cargo
        id: version
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}

          # The image tag comes from the git ref; the binary inside carries
          # workspace.package.version. Nothing otherwise ties them together, so a
          # tag pushed before the version bump — or mistyped — would publish an
          # image labelled one version containing another. Fail before pushing.
          CARGO_VERSION=$(awk '
            /^\[workspace\.package\]$/ { in_wp = 1; next }
            /^\[/ { in_wp = 0 }
            in_wp && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          BASE=${VERSION%%-*}
          if [ "$BASE" != "$CARGO_VERSION" ]; then
            echo "::error::tag v$VERSION disagrees with workspace.package.version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "tag v$VERSION matches Cargo version $CARGO_VERSION"

          # `latest` must not move to a prerelease or a backfilled older tag.
          LATEST_STABLE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | awk '!/-/' | sort -V | tail -1)
          if [ "v$VERSION" = "$LATEST_STABLE" ]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
            echo "not tagging latest: newest stable is $LATEST_STABLE"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.is_latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.title=rustunifimcp
            org.opencontainers.image.description=UniFi Network MCP server
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
