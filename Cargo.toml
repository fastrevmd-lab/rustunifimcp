[workspace]
members = [
    "rustunifimcp",
    "rustunifimcp-core",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustunifimcp"
authors = ["fastrevmd-lab"]

[workspace.dependencies]
rustunifimcp-core = { path = "rustunifimcp-core" }

# mecmcp crates are added per phase as they are tagged upstream. Only
# mecmcp-auth exists today; see PLAN.md for which phase gates on which crate.
# mecmcp-auth = { git = "https://github.com/fastrevmd-lab/mecmcp", tag = "auth-v0.1.1" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
