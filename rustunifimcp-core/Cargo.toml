[package]
name = "rustunifimcp-core"
description = "UniFi Network client, resource model, and MCP tool surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mecmcp-changeset.workspace = true
# "absolute-url": this crate builds request URLs with a hand-assembled,
# percent-encoded query string (offset/limit pagination) appended after the
# path, which `HttpRequest::with_base_and_path` has no way to carry — it only
# accepts a path-only `ExpandedPath`. The path segment is still validated
# through `mecmcp_openapi::expand_path` before the string is assembled, and
# every query key/value is percent-encoded to the unreserved set in
# `client::percent_encode`, so this does not reopen the path-injection risk
# `with_base_and_path` exists to close; it only trades the compile-time
# guarantee for the query portion, which was never covered by it.
mecmcp-http                = { workspace = true, features = ["absolute-url"] }
mecmcp-inventory.workspace = true
mecmcp-openapi.workspace   = true
mecmcp-redact.workspace    = true
mecmcp-secret.workspace    = true
mecmcp-server.workspace    = true
rmcp.workspace             = true
schemars.workspace         = true
serde.workspace            = true
serde_json.workspace       = true
thiserror.workspace        = true
tokio.workspace            = true
tracing.workspace          = true
url.workspace              = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
# Adds to the workspace tokio features for this crate's tests only: the private-CA
# TLS harness below needs a raw TcpListener and AsyncRead/AsyncWriteExt.
tokio = { workspace = true, features = ["net", "io-util"] }
